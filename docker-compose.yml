version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "wal_keep_size=2GB", "-c", "max_slot_wal_keep_size=2GB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d ordersdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: unless-stopped

  debezium:
    image: debezium/connect:2.5
    container_name: debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
    depends_on:
      - kafka
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  debezium-init:
    image: curlimages/curl:latest
    container_name: debezium-init
    volumes:
      - ./debezium:/debezium
      - debezium_data:/kafka/connect
    command: >
      sh -c "
        echo '=== Debezium Connector Registration ===';
        echo 'Phase 1: Wait for Debezium REST API...';
        for i in $$(seq 1 30); do
          if curl -sf http://debezium:8083/connectors > /dev/null 2>&1; then
            echo 'Debezium REST API is ready';
            break;
          fi;
          echo \"Attempt $$i/30: Debezium not ready, waiting 5s...\";
          sleep 5;
        done;
        echo 'Phase 2: Check if connector already exists...';
        if curl -sf http://debezium:8083/connectors/orders-outbox-connector | grep -q 'name'; then
          echo 'Connector already registered, skipping';
        else
          echo 'Phase 3: Registering connector with retry...';
          for i in $$(seq 1 15); do
            RESPONSE=$$(curl -s -X POST -H 'Accept:application/json' -H 'Content-Type:application/json' http://debezium:8083/connectors/ -d @/debezium/connector.json);
            if echo \"$RESPONSE\" | grep -q 'Already Exists'; then
              echo 'Connector registered successfully';
              break;
            elif echo \"$RESPONSE\" | grep -q 'order.created'; then
              echo 'Connector registered successfully';
              break;
            else
              echo \"Attempt $$i/15 failed: $$RESPONSE, retrying in 10s...\";
              sleep 10;
            fi;
          done;
        fi;
        echo '=== Registration complete ===';
      "
    restart: "no"
    depends_on:
      - debezium

  order-service:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    container_name: order-service
    ports:
      - "5000:5000"
    environment:
      ConnectionStrings__OrdersDb: "Host=postgres;Port=5432;Database=ordersdb;Username=orders;Password=orders"
      Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/Dockerfile
    container_name: payment-service
    environment:
      ConnectionStrings__OrdersDb: "Host=postgres;Port=5432;Database=ordersdb;Username=orders;Password=orders"
      Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    container_name: notification-service
    environment:
      Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  debezium_data:
